<header class="site-header">
  <div class="container header-inner">
    
    <!-- Logo -->
    <a routerLink="/" class="brand-logo" (click)="closeMobileMenu()">
      <img src="assets/logo_mvc.png" alt="Logo Máscaras vs Cabelleras" class="brand-logo-img" />
      <span class="brand-title">Máscaras <span class="brand-vs">vs</span> Cabelleras</span>
    </a>

    <!-- Navigation Links -->
    <nav class="nav-menu" [class.open]="isMobileMenuOpen()">
      <a 
        routerLink="/" 
        routerLinkActive="active" 
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMobileMenu()"
        class="nav-link">
        Inicio
      </a>
      <a 
        routerLink="/cartas" 
        routerLinkActive="active" 
        (click)="closeMobileMenu()"
        class="nav-link">
        Cartas
      </a>
      <a 
        routerLink="/reglas" 
        routerLinkActive="active" 
        (click)="closeMobileMenu()"
        class="nav-link">
        Reglas
      </a>
      <a 
        routerLink="/mazo" 
        routerLinkActive="active" 
        (click)="closeMobileMenu()"
        class="nav-link nav-deck">
        <span>Mi Mazo</span>
        <span class="deck-count" [class.ready]="deckService.totalCards() === 50">
          {{ deckService.totalCards() }}/50
        </span>
      </a>
      <a 
        routerLink="/acerca" 
        routerLinkActive="active" 
        (click)="closeMobileMenu()"
        class="nav-link">
        Historia
      </a>
    </nav>

    <!-- Social & Mobile Toggle -->
    <div class="header-actions">
      <a 
        href="https://www.instagram.com/mascarasvscabelleras_tcg/" 
        target="_blank" 
        rel="noopener" 
        class="social-icon-link ig"
        title="Instagram @mascarasvscabelleras_tcg"
        aria-label="Instagram">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="20" x="2" y="2" rx="5" ry="5"/>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
          <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/>
        </svg>
      </a>

      <a 
        href="https://www.facebook.com/mascarasvscabellerastcg" 
        target="_blank" 
        rel="noopener" 
        class="social-icon-link fb"
        title="Facebook Máscaras vs Cabelleras"
        aria-label="Facebook">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
        </svg>
      </a>

      <a 
        href="https://www.youtube.com/@mascarasvscabellerastcg" 
        target="_blank" 
        rel="noopener" 
        class="social-icon-link yt"
        title="YouTube @mascarasvscabellerastcg"
        aria-label="YouTube">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C21.505 3.545 12 3.545 12 3.545s-9.505 0-11.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 11.376.505 11.376.505s9.505 0 11.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
        </svg>
      </a>

      <button 
        type="button" 
        class="mobile-toggle" 
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="isMobileMenuOpen()"
        aria-label="Abrir menú">
        <span class="toggle-bar"></span>
        <span class="toggle-bar"></span>
      </button>
    </div>

  </div>
</header>
